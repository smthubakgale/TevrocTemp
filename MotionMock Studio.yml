# Primary Goals

Users should be able to:

* Export projects in multiple formats.
* Queue multiple exports.
* Save and reopen projects.
* Autosave progress.
* Duplicate projects.
* Save reusable templates.
* Optimize playback performance.
* Recover unsaved work after crashes.

